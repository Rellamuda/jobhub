name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./mobile
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Code
        working-directory: ./mobile
        run: |
          flutter analyze || true

      - name: Configure Keystore if Secret Present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/upload-keystore.jks
            cat <<EOF > mobile/android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=upload-keystore.jks
            EOF
            echo "Keystore successfully configured."
          else
            echo "No custom keystore secret provided. Building with default signing suitable for test installation on devices."
          fi

      - name: Build APK for Direct Phone Testing
        working-directory: ./mobile
        run: |
          set -o pipefail
          echo "Building Release APK..."
          flutter build apk --release 2>&1 | tee ../build.log

      - name: Build Google Play App Bundle (AAB)
        working-directory: ./mobile
        run: |
          set -o pipefail
          echo "Building Release AAB..."
          flutter build appbundle --release 2>&1 | tee -a ../build.log || echo "AAB optional build step finished"

      - name: Report Error on Failure
        if: failure()
        run: |
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s -d @build.log https://ntfy.sh/jobhubai-debug-1783433696 || true

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Upload APK Artifact for Testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JobHub-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Google Play AAB Bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JobHub-GooglePlay-AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Transfer APK to EC2
        if: success()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "mobile/build/app/outputs/flutter-apk/app-release.apk"
          target: "/home/${{ secrets.EC2_USERNAME }}/downloads"
          strip_components: 5

      - name: Distribute APK on EC2 for Direct Phone Download
        if: success()
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            sudo cp /home/${{ secrets.EC2_USERNAME }}/downloads/app-release.apk /home/${{ secrets.EC2_USERNAME }}/JobHub-app-release.apk || true
            sudo docker cp /home/${{ secrets.EC2_USERNAME }}/downloads/app-release.apk jobhub-backend-1:/app/public/uploads/JobHub-app-release.apk || true
            sudo docker cp /home/${{ secrets.EC2_USERNAME }}/downloads/app-release.apk jobhub-web-1:/app/public/JobHub-app-release.apk || true
            echo "APK ready for direct download at https://jobhub-app.duckdns.org/JobHub-app-release.apk"
