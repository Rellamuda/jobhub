name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        command_timeout: 30m
        script: |
          cd /home/${{ secrets.EC2_USERNAME }}/jobhub
          
          # Telemetry before deploy
          {
            echo "=== BEFORE DEPLOY ==="
            echo "Directory:" && pwd
            echo "Home Directory List:" && ls -la /home/ubuntu/
            echo "Systemd Services:" && (systemctl list-units --type=service | grep -i -E "job|docker|node|pm2" || true)
            echo "Public IP:" && curl -s http://checkip.amazonaws.com
            echo "Git Remote:" && git remote -v
            echo "Git Status:" && git status
            echo "Git Log:" && git log -n 3 --oneline
            echo "Docker Status:" && docker ps -a
            echo "Port Status (3000/3001):" && (sudo netstat -tulpn | grep -E "3000|3001" || true)
            echo "PM2 Status:" && (pm2 list || true)
          } > before_deploy.log
          curl -s -d @before_deploy.log https://ntfy.sh/jobhubai-debug-1783433696
          
          # Execute Deployment
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git clean -fd
          echo "Current git commit:" && git log -n 1 --oneline
          
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > ai-service/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > ai_service/.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "MAIL_FROM=JobHub Global <noreply@skillskonnect.online>" >> .env
          
          # Sync DuckDNS IP on every deploy
          curl -s "https://www.duckdns.org/update?domains=jobhub-app&token=31eb04ca-3350-43da-bd55-a55b80ef8a94&ip=" || true
          
          # Setup Nginx and SSL (Certbot) for jobhub-app.duckdns.org
          echo "=== Configuring Nginx and SSL ==="
          sudo apt-get update -y && sudo apt-get install -y nginx certbot python3-certbot-nginx
          
          # Write Nginx configuration for reverse proxy to Next.js (port 3000) and backend API (port 3001)
          sudo tee /etc/nginx/sites-available/jobhub << 'EOF'
          server {
              listen 80;
              server_name jobhub-app.duckdns.org;

              client_max_body_size 50M;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:3001/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /uploads/ {
                  proxy_pass http://127.0.0.1:3001/uploads/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /downloads/ {
                  proxy_pass http://127.0.0.1:3001/downloads/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF
          sudo ln -sf /etc/nginx/sites-available/jobhub /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl reload nginx || sudo systemctl restart nginx
          
          # Obtain SSL certificate non-interactively if not already installed
          if [ ! -d "/etc/letsencrypt/live/jobhub-app.duckdns.org" ]; then
            sudo certbot --nginx -d jobhub-app.duckdns.org --non-interactive --agree-tos -m erice@rellamuda.com --redirect || true
          else
            sudo certbot renew --quiet || true
          fi
          sudo systemctl reload nginx || true

          # Prevent Out of Memory (OOM) crashes during Docker build on small instances
          if ! sudo grep -q "swapfile" /etc/fstab; then
            echo "Creating swap file..."
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            echo "Swap file created."
          fi
          
          # Automatically expand Linux filesystem if EBS volume was increased
          echo "Checking and expanding filesystem..."
          sudo growpart /dev/xvda 1 2>/dev/null || sudo growpart /dev/nvme0n1 1 2>/dev/null || true
          sudo resize2fs /dev/xvda1 2>/dev/null || sudo resize2fs /dev/nvme0n1p1 2>/dev/null || sudo xfs_growfs / 2>/dev/null || true
          df -h
          
          echo "=== Docker Compose Down ==="
          docker compose down || true
          docker image rm -f jobhub-web jobhub_web 2>/dev/null || true
          echo "=== Building web container ==="
          docker compose build --no-cache web 2>&1 | tee /tmp/web_build.log | tail -n 20
          echo "=== Building all services ==="
          docker compose build 2>&1 | tee /tmp/compose_build.log | tail -n 20
          echo "=== Starting all services ==="
          docker compose up -d --force-recreate 2>&1 | tee /tmp/compose_up.log
          
          echo "=== Waiting 30s for services to start ==="
          sleep 30
          
          echo "=== Syncing database schema ==="
          docker compose exec -T backend npx prisma db push || true
          
          # Telemetry after deploy
          {
            echo "=== AFTER DEPLOY ==="
            echo "Docker Status:" && docker ps -a
            echo "Port Status (3000/3001):" && (sudo netstat -tulpn | grep -E "3000|3001" || true)
            echo "Configuring Linux firewall if enabled:"
            sudo ufw allow 3000/tcp || true
            sudo ufw allow 3001/tcp || true
            sudo ufw allow 80/tcp || true
            sudo ufw allow 443/tcp || true
            sudo ufw allow 8000/tcp || true
            echo "UFW Firewall Status:" && (sudo ufw status || true)
            echo "=== VERIFY DOMAIN & HTTPS ==="
            echo "Domain HTTP Test (port 80):" && (curl -s http://localhost/ | grep -o -i "Welcome to JobHub" || echo "NOT FOUND on port 80")
            echo "Domain HTTPS Test (port 443):" && (curl -s -k https://localhost/ | grep -o -i "Welcome to JobHub" || echo "NOT FOUND on port 443")
            echo "Local Curl Test (port 3000):" && (curl -s http://localhost:3000/ | grep -o -i "Welcome to JobHub" || echo "NOT FOUND in HTML")
            echo "Local Curl Test (port 3000 full title):" && (curl -s http://localhost:3000/ | grep -i "<title>" || echo "TITLE NOT FOUND")
            echo "=== COMPOSE UP OUTPUT ==="
            cat /tmp/compose_up.log 2>/dev/null || echo "No up log"
            echo "Docker Compose Logs (web):" && docker compose logs web --tail 30
            echo "Docker Compose Logs (backend):" && docker compose logs backend --tail 30
            echo "Docker Compose Logs (ai-service):" && docker compose logs ai-service --tail 20
          } > after_deploy.log
          cat after_deploy.log
          curl -H "Title: Deploy Success" -H "Priority: urgent" -d "$(<after_deploy.log)" https://ntfy.sh/jobhubai-debug-1783433696
