name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./mobile
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Code
        working-directory: ./mobile
        run: |
          flutter analyze || true

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: |
          flutter test || true

      - name: Build iOS Application (Release - Unsigned)
        working-directory: ./mobile
        run: |
          flutter build ios --release --no-codesign || (
            echo "Running fallback unsigned xcodebuild for Runner.app..."
            flutter build ios --config-only --release --no-codesign
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/ios \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              EXPANDED_CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES
            mkdir -p build/ios/iphoneos
            if [ -d "build/ios/Build/Products/Release-iphoneos/Runner.app" ]; then
              cp -r build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
            fi
          )

      - name: Package Unsigned IPA for Testing & Archival
        working-directory: ./mobile/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r JobHub-iOS-Release.ipa Payload
          cp JobHub-iOS-Release.ipa ../../../

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobHub-iOS-Release-IPA
          path: mobile/JobHub-iOS-Release.ipa
          retention-days: 14
