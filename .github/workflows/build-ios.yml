name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./mobile
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Code
        working-directory: ./mobile
        run: |
          flutter analyze || true

      - name: Build iOS Application (Release)
        working-directory: ./mobile
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for Testing & Archival
        working-directory: ./mobile/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r JobHub-iOS-Release.ipa Payload
          cp JobHub-iOS-Release.ipa ../../../

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobHub-iOS-Release-IPA
          path: mobile/JobHub-iOS-Release.ipa
          retention-days: 14
